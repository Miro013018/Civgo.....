name: Compiler les plugins CivGo

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fichiers du dépôt
        run: find . -not -path './.git/*' -type f | sort
      - name: Compiler chaque plugin
        run: |
          fail=0
          for p in $(find . -name pom.xml -not -path './.git/*' | sort); do
            d=$(dirname "$p")
            echo "=== Compilation de $d"
            if (cd "$d" && mvn -B -q clean package); then echo "OK $d"; else echo "ECHEC $d"; fail=1; fi
          done
          echo "=== Jars créés :"
          find . -path '*/target/*' -name 'CivGo*.jar'
          exit $fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CivGo-jars
          path: '**/target/CivGo*.jar'
