name: Compiler les plugins CivGo

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Voir les fichiers du dépôt
        run: find . -not -path './.git/*' -type f | sort
      - name: Compiler chaque plugin
        run: |
          found=0
          for p in $(find . -name pom.xml -not -path './.git/*'); do
            found=1
            (cd "$(dirname "$p")" && mvn -B -q clean package)
          done
          if [ "$found" = "0" ]; then echo "ERREUR : aucun fichier pom.xml dans le dépôt"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: CivGo-jars
          path: '**/target/CivGo*.jar'
