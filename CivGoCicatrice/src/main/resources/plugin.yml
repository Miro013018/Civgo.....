name: CivGoCicatrice
version: 1.0.0
main: fr.civgo.cicatrice.CivGoCicatrice
api-version: '1.21'
author: CivGo
description: Identité RP - nom RP choisi à la première connexion et Cicatrice qui brille pendant les Noirs.
commands:
  identite:
    description: Identité RP
    usage: /identite [whois <texte>|reset <pseudo>|setnom <pseudo> <nom>]
    aliases: [rpname]
  cicatrice:
    description: Voir ta Cicatrice
    usage: /cicatrice [pseudo]
permissions:
  civgo.cicatrice.admin:
    description: Voir les vrais pseudos, réinitialiser ou renommer une identité
    default: op
